<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220" role="img" aria-label="Astronaut Body Minimal">
  <defs>
    <linearGradient id="suit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2e8f0"/>
      <stop offset="1" stop-color="#a5b4fc"/>
    </linearGradient>
  </defs>
  <g id="body" stroke="#0ea5e9" stroke-opacity=".35" fill="url(#suit)" stroke-width="2">
    <rect x="50" y="70" width="100" height="90" rx="20"/>
    <rect x="65" y="90" width="70" height="42" rx="10" fill="#0b1220" opacity=".7"/>
    <circle cx="60" cy="130" r="12" fill="#38bdf8"/>
    <circle cx="140" cy="130" r="12" fill="#38bdf8"/>
    <rect x="40" y="160" width="40" height="36" rx="14"/>
    <rect x="120" y="160" width="40" height="36" rx="14"/>
  </g>
  <g id="handL" fill="#93c5fd" stroke="#2563eb" stroke-width="2">
    <rect x="22" y="96" width="28" height="18" rx="8"/>
  </g>
  <g id="handR" fill="#93c5fd" stroke="#2563eb" stroke-width="2">
    <rect x="150" y="96" width="28" height="18" rx="8"/>
  </g>
  <!-- Neck area where head snaps -->
  <circle id="neck" cx="100" cy="68" r="18" fill="#0ea5e9" opacity=".4"/>
</svg>